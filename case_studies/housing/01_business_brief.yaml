# =====================================================================
# STAGE 1 BUSINESS BRIEF -- house_50k_sample.csv
# Written before any cleaning code ran. Unattended run (no user available
# to ask); every judgment call below is made by the agent and justified
# inline, per unattended-run-conventions.
# =====================================================================

dataset: house_50k_sample.csv
grain: >
  One row per property_id (listing) after de-duplication. The raw file
  contains 136 rows that are exact full-row duplicates of another row
  (all 46 columns identical, including property_id) -- these are removed
  in Stage 4.11 so that property_id is unique on cleaned_data.csv.
  Pre-dedup raw grain was "one row per listing scrape event", which
  collapses to "one row per listing" post-dedup.

critical_columns:
  - property_id
  - country
  - property_type
  - city
  - listing_date
  - total_area
  - final_sale_price
  - listing_price
  - currency

allowed_values:
  country: [UAE, USA, Australia, Germany, Spain, India, Brazil, UK, Canada, France]
  property_type: [Penthouse, Apartment, Land, Studio, Villa, Condo, Townhouse]
  condition: [New, Old, Luxury, Under Construction, Renovated, Needs Repair]
  currency: ["₹", "£", "$", "€", "AED"]
  city:
    - Barcelona
    - Madrid
    - Dubai
    - Abu Dhabi
    - Mumbai
    - Vancouver
    - Lyon
    - Melbourne
    - Delhi
    - Paris
    - Marseille
    - Montreal
    - "São Paulo"
    - "Rio de Janeiro"
    - Brisbane
    - Toronto
    - Sydney
    - Bangalore
    - Birmingham
    - Manchester
    - London
    - Leeds
    - Chicago
    - Los Angeles
    - "München"
    - Frankfurt
    - Hamburg
    - "New York"
    - Houston
    - Phoenix
    - Berlin
    # 31 canonical cities. Two raw-value collapses required (see
    # dangerous_columns.city and business_rules.BR2 below):
    #   "Sao Paulo" (ASCII) -> "São Paulo" (diacritic form retained as canonical)
    #   "Munich" (English exonym) -> "München" (diacritic/native form retained as canonical)

dangerous_columns:
  city:
    fuzzy_matching: false
    reason: >
      MEASURED with rapidfuzz.fuzz.token_sort_ratio on 2026-07-29:
      token_sort_ratio('Munich','München') = 61.54 -- below even the 70
      "flag for review" floor, so a generic fuzzy pass would classify this
      pair as UNKNOWN CATEGORY and leave two cities that are the same place
      permanently split. token_sort_ratio('Sao Paulo','São Paulo') = 88.89
      -- this one WOULD auto-correct under the 85 threshold, but relying on
      fuzzy matching for one pair and an explicit map for the other in the
      same column is an inconsistent, hard-to-audit policy. Both are
      ASCII-transliteration pairs, not edit-distance typos, so both are
      handled by one explicit alias map (BR2) instead of any fuzzy pass.
      Canonical choice (São Paulo, München) is by linguistic/native-spelling
      correctness, not frequency -- counts are near-tied (São Paulo 1663 vs
      Sao Paulo 1632; München 986 vs Munich 1009) so frequency would be an
      arbitrary tiebreaker here anyway.
  condition:
    fuzzy_matching: false
    reason: >
      Not a fuzzy-matching case at all: raw values are "New" (7231) and
      "new" (7239), a pure case duplicate of the same canonical token, not
      an edit-distance typo. Resolved by case normalization (Title Case) in
      Stage 4.3, which merges them losslessly. No other condition value is
      within edit distance of another (Old/Luxury/Under Construction/
      Renovated/Needs Repair are all lexically distinct) -- verified by
      inspecting the full 7-value distribution, no fuzzy pass required or run.
  country:
    fuzzy_matching: false
    reason: >
      nunique(country) = 10, and all 10 raw values exactly match the
      canonical list with zero variant spellings observed in profiling
      (Stage 3 full value_counts on this column matched allowed_values
      exactly). No typos to correct, so no fuzzy matching was run.
  property_type:
    fuzzy_matching: false
    reason: >
      nunique(property_type) = 7, exact match to canonical list, zero
      variants observed. No fuzzy matching run.
  currency:
    fuzzy_matching: false
    reason: >
      COLLISION GUARD TRIPS on this column: rapidfuzz's default_process
      strips non-alphanumeric characters, so "₹", "£", "$", "€" (none of
      which contain a letter/digit) all reduce to the same empty-string
      key -- 4 of the 5 canonicals become indistinguishable to a fuzzy
      matcher. Fuzzy matching is refused outright for this column
      regardless of whether it's needed. Separately (and moot given the
      guard trip): nunique(currency) = 5, exact match to canonical
      symbols, zero variants observed, so exact-match handling alone is
      sufficient -- 0 corrections applied either way.

missing_value_strategy:
  # Stage 3 profiling scanned every one of the 46 columns for the full
  # null-disguise set ('', ' ', '-', '?', 'n/a', 'na', 'null', 'none',
  # 'tbd', 'unknown', 'undefined', '#n/a', '#value!', '#ref!') plus true
  # NaN. ZERO nulls or null disguises were found in any column of this
  # 50,000-row file. Every entry below is therefore a standing policy for
  # if a null ever appears (e.g. on a future refresh of this feed), not a
  # correction applied on this run.
  property_id: never_impute
  country: never_impute
  property_type: never_impute
  condition: leave_null
  bedrooms: leave_null
  bathrooms: leave_null
  floors: leave_null
  parking_spots: leave_null
  built_year: leave_null
  city: never_impute
  total_area: never_impute
  land_area: leave_null
  latitude: leave_null
  longitude: leave_null
  district: leave_null
  postal_code: leave_null
  listing_date: never_impute
  interest_rate: leave_null
  inflation_index: leave_null
  housing_index: leave_null
  luxury_demand_index: leave_null
  final_sale_price: never_impute
  listing_price: never_impute
  price_per_sqm: never_impute
  currency: never_impute
  hoa_fee: leave_null
  property_tax: leave_null
  days_on_market: leave_null
  price_revision_count: leave_null
  title: leave_null
  description: leave_null
  noise_0: leave_null
  noise_1: leave_null
  noise_2: leave_null
  noise_3: leave_null
  noise_4: leave_null
  noise_5: leave_null
  noise_6: leave_null
  noise_7: leave_null
  noise_8: leave_null
  noise_9: leave_null
  noise_10: leave_null
  noise_11: leave_null
  noise_12: leave_null
  noise_13: leave_null
  noise_14: leave_null

