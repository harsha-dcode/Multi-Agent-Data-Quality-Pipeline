# =============================================================================
# STAGE 1 BUSINESS BRIEF
# Logistics / Supply Chain shipment dataset (India, INR)
# Produced: unattended run, 2026-07-29. No user available to ask -- every
# judgment call below is made conservatively and justified inline, per
# behavioral rule 5 (resolve ambiguity explicitly, conservative default).
# =============================================================================

dataset: logistics_supply_chain_dataset_v3.csv

grain: >
  One row = one shipment (Shipment_ID). NOTE: Order_ID is NOT the grain --
  23,621 distinct Order_IDs across 30,102 shipment rows confirms orders are
  legitimately split into multiple shipments (partial/multi-leg fulfillment).
  This is expected multiplicity, not a duplication defect.

critical_columns:
  # A null in any of these makes the row useless for the dataset's core
  # purpose (shipment tracking, routing, and revenue/cost reporting).
  - Shipment_ID
  - Order_ID
  - Customer_ID
  - Shipment_Date
  - Pickup_Date
  - Dispatch_Date
  - Expected_Delivery_Date
  - Delivery_Status
  - Customer_Type
  - Industry
  - Warehouse_ID
  - Warehouse_Name
  - Warehouse_City
  - Warehouse_State
  - Warehouse_Region
  - Destination_City
  - Destination_State
  - Destination_Region
  - Distance_KM
  - Transport_Mode
  - Vehicle_Type
  - Product_Category
  - Shipping_Cost_INR
  - Operational_Cost_INR
  - Revenue_INR
  - Profit_INR
  - Return_Status

allowed_values:
  Delivery_Status: ["On Time", "Delayed", "Early", "In Transit"]
  Customer_Type: ["Enterprise", "Retail", "Wholesale"]
  Industry: ["Distribution", "Import-Export", "Manufacturing", "E-Commerce",
             "Automotive", "Electronics Retail", "Banking & Finance",
             "Pharmacy", "Supermarket", "Fashion Retail", "Agriculture Supply",
             "Technology", "Telecom", "FMCG", "Pharmaceuticals"]
  Warehouse_ID: ["WH001","WH002","WH003","WH004","WH005","WH006","WH007",
                 "WH008","WH009","WH010","WH011","WH012"]
  Warehouse_Region: ["East", "North", "South", "West"]
  Destination_Region: ["Central", "East", "North", "South", "West"]
  Transport_Mode: ["Road", "Air", "Rail", "Sea"]
  Vehicle_Type: ["Heavy Truck", "Container Truck", "Medium Truck",
                 "Cargo Plane", "Mini Truck", "Commercial Cargo Flight",
                 "Freight Train", "Express Freight Train", "Pickup Van",
                 "Container Ship", "Bulk Carrier"]
  Product_Category: ["FMCG", "Clothing & Apparel", "Electronics",
                      "Food & Beverages", "Auto Parts", "Chemicals",
                      "Industrial Equipment", "Books & Stationery",
                      "Pharmaceuticals", "Furniture"]
  Return_Status: ["Not Returned", "Returned"]
  # Destination_City / Warehouse_City / Warehouse_State / Destination_State are
  # open geographic sets (29-41 Indian cities / 11-18 states observed) --
  # not enumerated here in full; canonical spelling verified against the
  # profiled unique-value list in 01_profile_report.txt.

dangerous_columns: {}
# I RAN THE GUARD AND NOTHING TRIPPED. Measured evidence (see
# 01c_more_checks_report.txt, section "COLLISION GUARD"):
#   from thefuzz import utils
#   canonicals_collide(canon_list) -> False for ALL 9 categorical columns
#   tested (Delivery_Status, Customer_Type, Transport_Mode, Product_Category,
#   Vehicle_Type, Industry, Return_Status, Warehouse_Region,
#   Destination_Region). No canonical pair reduces to an identical
#   preprocessed key. Highest within-set collision risk found was
#   'Not Returned' vs 'Returned' at token_sort_ratio=80 (still well below the
#   85 auto-correct threshold, and these two values never occur as messy
#   variants of each other in the raw data) and 'Freight Train' vs
#   'Express Freight Train' at 76. Fuzzy matching is authorized on all
#   tested categorical columns.

missing_value_strategy:
  # PER COLUMN. No blanket rule. Revenue/cost factors and identifiers are
  # never_impute per explicit run instruction.
  Shipment_ID: never_impute            # identifier, 0% null
  Order_ID: never_impute               # identifier, 0% null
  Shipment_Date: never_impute          # date, 0% null
  Pickup_Date: never_impute            # date, 0% null
  Dispatch_Date: never_impute          # date, 0% null
  Expected_Delivery_Date: never_impute # date, 0% null
  Actual_Delivery_Date: leave_null     # 230 nulls (0.76%) = shipments still
                                        # "In Transit" -- confirmed 1:1 with
                                        # Delivery_Status=In Transit. Null IS
                                        # information (not yet delivered).
  Delivery_Status: never_impute        # 0% null, critical categorical
  Delay_Days: leave_null               # 230 nulls, same rows as
                                        # Actual_Delivery_Date -- delay is
                                        # inherently unknown before delivery.
  Customer_ID: never_impute            # identifier, 0% null
  Customer_Type: never_impute          # 0% null, critical categorical
  Industry: never_impute               # 0% null, critical categorical
  Warehouse_ID: never_impute           # identifier, 0% null
  Warehouse_Name: never_impute         # 0% null
  Warehouse_City: never_impute         # 0% null
  Warehouse_State: never_impute        # 0% null
  Warehouse_Region: never_impute       # 0% null
  Destination_City: never_impute       # 0% null
  Destination_State: never_impute      # 0% null
  Destination_Region: never_impute     # 0% null
  Distance_KM: never_impute            # 0% null, cost driver
  Transport_Mode: never_impute         # 0% null, critical categorical
  Vehicle_Type: never_impute           # 0% null, critical categorical
  Driver_ID: never_impute              # identifier; 7,228 nulls (24.01%) are
                                        # legitimate (Air/Sea shipments have
                                        # no truck driver -- confirmed 100%
                                        # overlap with Transport_Mode in
                                        # {Air, Airways, Sea}; Rail shipments
                                        # DO carry a Driver_ID). Never impute
                                        # a fabricated driver identity.
  Product_Category: never_impute       # 0% null, critical categorical
  Shipment_Weight_KG: leave_null       # 900 nulls (2.99%), no business-logic
                                        # correlation found (not tied to
                                        # Transport_Mode or any other column);
                                        # genuine data gap. Not a cost/revenue/
                                        # id field -- do not fabricate a
                                        # physical measurement.
  Shipment_Volume_CBM: leave_null      # 0% null observed; documented for
                                        # future-proofing as a physical
                                        # measure, same reasoning as weight.
  Shipping_Cost_INR: never_impute      # cost factor, 0% null
  Fuel_Cost_INR: never_impute          # cost factor; 1,203 nulls (4.00%)
                                        # spread across ALL transport modes
                                        # with no clean correlation --
                                        # genuine gap, never fabricate a cost.
  Operational_Cost_INR: never_impute   # cost factor, 0% null
  Revenue_INR: never_impute            # revenue factor, 0% null
  Profit_INR: never_impute             # revenue/cost-derived factor, 0% null
  Customer_Rating: leave_null          # 1,718 nulls (5.71%); subjective
                                        # customer-submitted score -- a
                                        # customer who didn't rate is not the
                                        # same as a customer who rated 0.
  Return_Status: never_impute          # 0% null, critical categorical
  Delay_Reason: leave_null             # 21,738 nulls (72.21%); legitimately
                                        # blank for On Time/Early/In Transit
                                        # shipments. Even among Delayed
                                        # shipments, 170 have no captured
                                        # reason -- never invent a narrative.

