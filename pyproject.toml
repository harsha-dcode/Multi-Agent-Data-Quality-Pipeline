[project]
name = "multi-agent-data-quality-pipeline"
version = "1.0.0"
description = "Agent-orchestrated data quality pipeline with guardrails, row-level audit trails, and a deterministic run gate"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.77",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
