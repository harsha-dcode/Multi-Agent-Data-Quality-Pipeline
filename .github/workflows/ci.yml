name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pipeline logic tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No API key is needed — the tests exercise pure transformation logic.
      # The SDK package itself IS required, because src/agent/tools/__init__.py
      # imports it at module scope. Decoupling that import is on the roadmap;
      # until then, installing the package is the honest way to run these.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy pytest pyyaml claude-agent-sdk

      - name: Run pipeline logic tests
        run: pytest tests/ -v

  gate:
    name: Run-completeness gate (self-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # Every committed case study must still satisfy the completeness gate.
      # This is what stops a run from being published with a missing change
      # log, a blanket imputation policy, or an unreconstructable audit trail.
      - name: Verify every committed case study passes the gate
        run: |
          status=0
          for d in case_studies/*/; do
            [ -f "$d/01_business_brief.yaml" ] || continue
            echo "::group::gate $d"
            python check_run_complete.py "$d" || status=1
            echo "::endgroup::"
          done
          exit $status
